<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>SpaceTour TR — Motion Graphics Studio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Geist+Mono:wght@400;600;700&family=Instrument+Serif:ital@1&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #050508;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas {
      display: block;
      background: #050508;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const ASSET_URLS = {
      cellarius: 'http://localhost:3000/images/space/cellarius-harmonia-macrocosmica-planisphaerium-braheum-f160fa.jpg',
      earth: 'http://localhost:3000/images/space/the-earth-seen-from-apollo-17-e09623.jpg',
      vlt_laser: 'http://localhost:3000/images/space/vlt-laser-guide-star-img-4310-c2ab6c.jpg',
      crab_opt: 'http://localhost:3000/images/space/crab-nebula-bf6d6a.jpg',
      crab_multi: 'http://localhost:3000/images/space/crab-nebula-ngc-1952-composite-from-chandra-hubble-and-spitz-bf199c.jpg',
      pillars: 'http://localhost:3000/images/space/pillars-of-creation-nircam-image-98baee.jpg',
      zodiac: 'http://localhost:3000/images/space/sidney-hall-urania-s-mirror-leo-major-and-leo-minor-ae1988.jpg',
      iss: 'http://localhost:3000/images/space/iss-62-city-lights-at-the-intersection-of-europe-and-asia-eb1c8f.jpg',
    };

    const IMAGES = {};
    let assetsLoaded = false;

    // Generate fixed random star particles for cinematic dust
    const PARTICLES = Array.from({ length: 80 }, (_, i) => ({
      x: ((i * 137.5) % 1000) / 1000,
      y: ((i * 224.7) % 1000) / 1000,
      size: 0.8 + ((i * 31) % 100) / 70,
      speedX: -0.0004 + ((i * 17) % 100) / 120000,
      speedY: -0.0006 - ((i * 19) % 100) / 100000,
      phase: (i * 0.4) % (Math.PI * 2),
      alpha: 0.3 + ((i * 43) % 100) / 180,
    }));

    window.__initStudio = async function(w, h, dataUrls) {
      canvas.width = w;
      canvas.height = h;

      const sources = dataUrls || ASSET_URLS;
      const promises = Object.entries(sources).map(([key, url]) => {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => { IMAGES[key] = img; resolve(); };
          img.onerror = () => { console.warn('Failed to load asset: ' + key); resolve(); };
          img.src = url;
        });
      });

      await Promise.all(promises);
      await document.fonts.ready;
      assetsLoaded = true;
      return true;
    };

    // Helper: Draw image with Ken Burns cover & pan
    function drawKenBurns(img, p, panX1, panY1, panX2, panY2, scale1, scale2, alpha = 1.0) {
      if (!img) return;
      const W = canvas.width;
      const H = canvas.height;

      ctx.save();
      ctx.globalAlpha = alpha;

      const scale = scale1 + (scale2 - scale1) * p;
      const panX = panX1 + (panX2 - panX1) * p;
      const panY = panY1 + (panY2 - panY1) * p;

      // Calculate cover dimensions
      const imgAspect = img.width / img.height;
      const screenAspect = W / H;
      let drawW, drawH;

      if (imgAspect > screenAspect) {
        drawH = H * scale;
        drawW = drawH * imgAspect;
      } else {
        drawW = W * scale;
        drawH = drawW / imgAspect;
      }

      const drawX = (W - drawW) / 2 + panX * (drawW - W);
      const drawY = (H - drawH) / 2 + panY * (drawH - H);

      ctx.drawImage(img, drawX, drawY, drawW, drawH);
      ctx.restore();
    }

    // Helper: Draw Anamorphic Bars & Metadata
    function drawLetterboxing(isVertical) {
      const W = canvas.width;
      const H = canvas.height;
      const barTop = isVertical ? 60 : 44;
      const barBottom = isVertical ? 76 : 56;

      ctx.save();
      // Top bar
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, W, barTop);
      ctx.strokeStyle = 'rgba(244, 243, 238, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, barTop);
      ctx.lineTo(W, barTop);
      ctx.stroke();

      // Top bar text
      ctx.fillStyle = '#F5C542';
      ctx.font = '600 ' + (isVertical ? '12px' : '10px') + ' "Geist Mono", monospace';
      ctx.letterSpacing = '0.28em';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('SPACETOUR TR · KOZMİK GÖZLEM ATLASI', isVertical ? 28 : 44, barTop / 2);

      ctx.fillStyle = 'rgba(244, 243, 238, 0.5)';
      ctx.textAlign = 'right';
      ctx.fillText('J2000 EFEMERİS · CANLI VERİ AĞI', W - (isVertical ? 28 : 44), barTop / 2);

      // Bottom bar
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, H - barBottom, W, barBottom);
      ctx.beginPath();
      ctx.moveTo(0, H - barBottom);
      ctx.lineTo(W, H - barBottom);
      ctx.stroke();

      // Bottom bar text
      ctx.fillStyle = 'rgba(244, 243, 238, 0.45)';
      ctx.textAlign = 'left';
      ctx.fillText('BİR UZAY BELGESELİ · YEDİ BÖLÜM', isVertical ? 28 : 44, H - barBottom / 2);

      ctx.fillStyle = '#F5C542';
      ctx.textAlign = 'right';
      ctx.fillText('SPACETOUR.COM.TR', W - (isVertical ? 28 : 44), H - barBottom / 2);

      ctx.restore();
    }

    // Helper: Draw Lower Third Documentary Slate
    function drawLowerThird(isVertical, pill, label, mainTitle, accentTitle, credit, alpha = 1.0) {
      const W = canvas.width;
      const H = canvas.height;
      const barBottom = isVertical ? 76 : 56;
      const cardBottom = barBottom + (isVertical ? 120 : 36);
      const cardLeft = isVertical ? 36 : 48;
      const cardRight = isVertical ? 36 : 48;

      ctx.save();
      ctx.globalAlpha = alpha;

      // Dark gradient vignette behind text
      const gradH = isVertical ? 240 : 180;
      const grad = ctx.createLinearGradient(0, H - barBottom, 0, H - barBottom - gradH);
      grad.addColorStop(0, 'rgba(5, 5, 8, 0.95)');
      grad.addColorStop(0.5, 'rgba(5, 5, 8, 0.5)');
      grad.addColorStop(1, 'rgba(5, 5, 8, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, H - barBottom - gradH, W, gradH);

      // 1. Badge Pill (e.g. "BÖLÜM 01  ———  GÖK HARİTASI")
      const pillY = H - cardBottom - (isVertical ? 110 : 80);
      ctx.font = '700 ' + (isVertical ? '13px' : '11px') + ' "Geist Mono", monospace';
      ctx.fillStyle = '#F5C542';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(pill, cardLeft, pillY);

      const pillWidth = ctx.measureText(pill).width;
      const lineX = cardLeft + pillWidth + 14;
      const lineLen = 50;

      // Golden dividing rule
      const lineGrad = ctx.createLinearGradient(lineX, 0, lineX + lineLen, 0);
      lineGrad.addColorStop(0, '#F5C542');
      lineGrad.addColorStop(1, 'transparent');
      ctx.strokeStyle = lineGrad;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lineX, pillY);
      ctx.lineTo(lineX + lineLen, pillY);
      ctx.stroke();

      ctx.fillStyle = 'rgba(244, 243, 238, 0.7)';
      ctx.fillText(label, lineX + lineLen + 14, pillY);

      // 2. Titles (MAIN Archivo uppercase + ACCENT Instrument Serif italic)
      const titleY = H - cardBottom;
      const mainFont = '900 ' + (isVertical ? '58px' : '52px') + ' "Archivo", sans-serif';
      const accentFont = 'italic 400 ' + (isVertical ? '66px' : '60px') + ' "Instrument Serif", Georgia, serif';

      ctx.font = mainFont;
      ctx.fillStyle = '#F4F3EE';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 24;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(mainTitle, cardLeft, titleY);

      const mainWidth = ctx.measureText(mainTitle).width;
      ctx.font = accentFont;
      ctx.fillStyle = '#F5C542';
      ctx.fillText(accentTitle, cardLeft + mainWidth + 14, titleY);
      ctx.shadowBlur = 0;

      // 3. Source Credit Badge (Bottom Right)
      if (credit) {
        ctx.font = '600 ' + (isVertical ? '12px' : '11px') + ' "Geist Mono", monospace';
        const creditText = credit;
        const textW = ctx.measureText(creditText).width;
        const badgeW = textW + 24;
        const badgeH = 28;
        const badgeX = isVertical ? cardLeft : W - cardRight - badgeW;
        const badgeY = isVertical ? titleY + 36 : titleY - 24;

        ctx.fillStyle = 'rgba(11, 11, 16, 0.85)';
        ctx.strokeStyle = 'rgba(244, 243, 238, 0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 4);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(244, 243, 238, 0.7)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(creditText, badgeX + badgeW / 2, badgeY + badgeH / 2);
      }

      ctx.restore();
    }

    // Helper: Draw floating stardust particles
    function drawParticles(t) {
      const W = canvas.width;
      const H = canvas.height;
      ctx.save();
      for (const p of PARTICLES) {
        const x = ((p.x + p.speedX * t * 30) % 1 + 1) % 1 * W;
        const y = ((p.y + p.speedY * t * 30) % 1 + 1) % 1 * H;
        const alpha = p.alpha * (0.6 + 0.4 * Math.sin(p.phase + t * 2.5));

        ctx.fillStyle = 'rgba(245, 197, 66, ' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Helper: Draw Animated Solar Orrery Ellipses
    function drawOrreryOverlay(p, isVertical) {
      const W = canvas.width;
      const H = canvas.height;
      const cx = isVertical ? W * 0.5 : W * 0.45;
      const cy = isVertical ? H * 0.42 : H * 0.48;

      ctx.save();
      ctx.translate(cx, cy);

      // Sun glow
      const sunRad = isVertical ? 22 : 28;
      const sunGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, sunRad * 3.5);
      sunGrad.addColorStop(0, '#f59e0b');
      sunGrad.addColorStop(0.3, 'rgba(245, 158, 11, 0.6)');
      sunGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(0, 0, sunRad * 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Solid Sun core
      ctx.fillStyle = '#fff4d0';
      ctx.beginPath();
      ctx.arc(0, 0, sunRad, 0, Math.PI * 2);
      ctx.fill();

      // Orbits: Mercury, Venus, Earth, Mars, Jupiter
      const orbits = [
        { r: isVertical ? 70 : 90, color: 'rgba(244, 243, 238, 0.25)', speed: 1.6, pColor: '#d4d4d8', pRad: 3.5, label: 'MERKÜR' },
        { r: isVertical ? 120 : 155, color: 'rgba(244, 243, 238, 0.22)', speed: 1.1, pColor: '#fde047', pRad: 5, label: 'VENÜS' },
        { r: isVertical ? 175 : 230, color: 'rgba(56, 189, 248, 0.4)', speed: 0.8, pColor: '#38bdf8', pRad: 5.5, label: 'DÜNYA · 1.00 AU' },
        { r: isVertical ? 230 : 310, color: 'rgba(244, 243, 238, 0.2)', speed: 0.55, pColor: '#f87171', pRad: 4.5, label: 'MARS' },
        { r: isVertical ? 310 : 420, color: 'rgba(245, 197, 66, 0.35)', speed: 0.3, pColor: '#fbbf24', pRad: 9, label: 'JÜPİTER · 5.20 AU' }
      ];

      for (const orb of orbits) {
        ctx.strokeStyle = orb.color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0, 0, orb.r, orb.r * 0.45, -0.25, 0, Math.PI * 2);
        ctx.stroke();

        // Planet position
        const angle = p * Math.PI * 2 * orb.speed - 0.25;
        const px = Math.cos(angle) * orb.r;
        const py = Math.sin(angle) * orb.r * 0.45;

        ctx.fillStyle = orb.pColor;
        ctx.shadowColor = orb.pColor;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(px, py, orb.pRad, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Label
        if (orb.label.includes('DÜNYA') || orb.label.includes('JÜPİTER')) {
          ctx.font = '600 ' + (isVertical ? '10px' : '9px') + ' "Geist Mono", monospace';
          ctx.fillStyle = 'rgba(244, 243, 238, 0.85)';
          ctx.fillText(orb.label, px + 10, py - 4);
        }
      }

      ctx.restore();
    }

    // Helper: Draw Constellation Asterism Lines on VLT Sky Map
    function drawConstellationOverlay(p, isVertical) {
      const W = canvas.width;
      const H = canvas.height;
      ctx.save();

      // Big Dipper (Ursa Major) points
      const offsetX = isVertical ? W * 0.35 : W * 0.55;
      const offsetY = isVertical ? H * 0.35 : H * 0.32;
      const pts = [
        [0, 0], [45, 12], [85, 30], [130, 48],
        [150, 95], [210, 85], [190, 42]
      ];

      ctx.strokeStyle = 'rgba(245, 197, 66, ' + (0.4 + 0.3 * Math.sin(p * 5)) + ')';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);

      ctx.beginPath();
      pts.forEach(([x, y], i) => {
        const sx = offsetX + x;
        const sy = offsetY + y;
        if (i === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      });
      // Close the spoon bowl
      ctx.lineTo(offsetX + pts[3][0], offsetY + pts[3][1]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw star diamonds
      pts.forEach(([x, y]) => {
        const sx = offsetX + x;
        const sy = offsetY + y;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#F5C542';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      ctx.font = '700 11px "Geist Mono", monospace';
      ctx.fillStyle = '#F5C542';
      ctx.fillText('URSA MAJOR (BÜYÜK AYI)', offsetX + 50, offsetY - 14);

      ctx.restore();
    }

    // Helper: Draw Multi-Wavelength Wipe (Crab Nebula Optical -> Chandra X-Ray / Spitzer Composite)
    function drawSpectrumWipe(p, isVertical) {
      const W = canvas.width;
      const H = canvas.height;

      // 1. Draw Optical base
      drawKenBurns(IMAGES.crab_opt, p, 0.45, 0.5, 0.55, 0.5, 1.05, 1.15, 1.0);

      // 2. Draw Multi-Wavelength composite on the right with animated laser wipe
      const wipeX = W * (0.2 + 0.6 * p);

      ctx.save();
      ctx.beginPath();
      ctx.rect(wipeX, 0, W - wipeX, H);
      ctx.clip();
      drawKenBurns(IMAGES.crab_multi, p, 0.45, 0.5, 0.55, 0.5, 1.05, 1.15, 1.0);
      ctx.restore();

      // 3. Glowing Golden Laser Divider Line
      ctx.save();
      const laserGrad = ctx.createLinearGradient(0, 0, 0, H);
      laserGrad.addColorStop(0, 'transparent');
      laserGrad.addColorStop(0.2, '#F5C542');
      laserGrad.addColorStop(0.5, '#ffffff');
      laserGrad.addColorStop(0.8, '#F5C542');
      laserGrad.addColorStop(1, 'transparent');

      ctx.strokeStyle = laserGrad;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#F5C542';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.moveTo(wipeX, 0);
      ctx.lineTo(wipeX, H);
      ctx.stroke();

      // Badge on the laser line
      ctx.fillStyle = '#0B0B10';
      ctx.strokeStyle = '#F5C542';
      ctx.lineWidth = 1;
      const labelW = 140;
      const labelH = 24;
      const labelY = H * 0.45;
      ctx.beginPath();
      ctx.roundRect(wipeX - labelW / 2, labelY, labelW, labelH, 999);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#F5C542';
      ctx.font = '700 9px "Geist Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('X-IŞINI / KIZILÖTESİ', wipeX, labelY + labelH / 2);

      ctx.restore();
    }

    // MAIN FRAME RENDERER CALLED BY PUPPETEER
    window.renderFrame = function(frameIndex, format = 'yatay') {
      if (!assetsLoaded) return;
      const isVertical = format === 'dikey';
      const W = canvas.width;
      const H = canvas.height;
      const t = frameIndex / 30.0; // Current time in seconds

      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, W, H);

      // -----------------------------------------------------------------------
      // ACT 1 (0.0s - 3.5s): PROLOGUE — Cellarius Macrocosm (1660)
      // Voice: "Gökyüzü hiç durmadı."
      // -----------------------------------------------------------------------
      if (t < 3.5) {
        const p = t / 3.5;
        const fadeIn = Math.min(1.0, t / 0.8);
        const fadeOut = t > 3.0 ? (3.5 - t) / 0.5 : 1.0;
        const alpha = fadeIn * fadeOut;

        drawKenBurns(IMAGES.cellarius, p, 0.5, 0.45, 0.5, 0.55, 1.1, 1.25, alpha * 0.65);

        // Center Prologue Slate
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#F5C542';
        ctx.font = '700 ' + (isVertical ? '14px' : '12px') + ' "Geist Mono", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('BÖLÜM 00 — BİR UZAY BELGESELİ', W / 2, H / 2 - (isVertical ? 50 : 40));

        // Pulsing Gold Beam
        const beamW = (isVertical ? 180 : 260) * (0.8 + 0.2 * Math.sin(t * 3));
        const beamGrad = ctx.createLinearGradient(W / 2 - beamW / 2, 0, W / 2 + beamW / 2, 0);
        beamGrad.addColorStop(0, 'transparent');
        beamGrad.addColorStop(0.5, '#F5C542');
        beamGrad.addColorStop(1, 'transparent');
        ctx.strokeStyle = beamGrad;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W / 2 - beamW / 2, H / 2 - (isVertical ? 25 : 18));
        ctx.lineTo(W / 2 + beamW / 2, H / 2 - (isVertical ? 25 : 18));
        ctx.stroke();

        // Main Title
        ctx.font = '900 ' + (isVertical ? '68px' : '76px') + ' "Archivo", sans-serif';
        ctx.fillStyle = '#F4F3EE';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 30;
        ctx.fillText('SPACETOUR', W / 2 - (isVertical ? 40 : 50), H / 2 + (isVertical ? 35 : 25));

        ctx.font = 'italic 400 ' + (isVertical ? '76px' : '84px') + ' "Instrument Serif", serif';
        ctx.fillStyle = '#F5C542';
        ctx.fillText('atlası', W / 2 + (isVertical ? 150 : 180), H / 2 + (isVertical ? 35 : 25));
        ctx.shadowBlur = 0;

        ctx.font = '600 ' + (isVertical ? '12px' : '10px') + ' "Geist Mono", monospace';
        ctx.fillStyle = 'rgba(244, 243, 238, 0.55)';
        ctx.fillText('YEDİ BÖLÜMLÜK SİNEMATİK GÖKYÜZÜ REHBERİ', W / 2, H / 2 + (isVertical ? 80 : 64));
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // ACT 2 (3.5s - 8.0s): ORRERY & APOLLO 17 EARTH
      // Voice: "Yıldızlar yer değiştirdi, gezegenler yollarını çizdi..."
      // -----------------------------------------------------------------------
      else if (t < 8.0) {
        const p = (t - 3.5) / 4.5;
        const fadeIn = Math.min(1.0, (t - 3.5) / 0.5);
        const fadeOut = t > 7.5 ? (8.0 - t) / 0.5 : 1.0;
        const alpha = fadeIn * fadeOut;

        drawKenBurns(IMAGES.earth, p, 0.35, 0.4, 0.65, 0.5, 1.0, 1.15, alpha * 0.5);
        drawOrreryOverlay(p, isVertical);

        drawLowerThird(isVertical, 'BÖLÜM 00', 'GİRİŞ', 'EVREN', 'hiç durmaz.', 'JPL / NASA YÖRÜNGE ELEMANLARI', alpha);
      }

      // -----------------------------------------------------------------------
      // ACT 3 (8.0s - 12.5s): 360° PLANETARIUM SKY MAP & VLT LASER
      // Voice: "...ışık milyarlarca yıl yol aldı."
      // -----------------------------------------------------------------------
      else if (t < 12.5) {
        const p = (t - 8.0) / 4.5;
        const fadeIn = Math.min(1.0, (t - 8.0) / 0.5);
        const fadeOut = t > 12.0 ? (12.5 - t) / 0.5 : 1.0;
        const alpha = fadeIn * fadeOut;

        drawKenBurns(IMAGES.vlt_laser, p, 0.6, 0.35, 0.4, 0.65, 1.05, 1.2, alpha * 0.95);
        drawConstellationOverlay(p, isVertical);

        drawLowerThird(isVertical, 'BÖLÜM 01', 'GÖK HARİTASI', 'GÖĞÜ', 'oku.', 'VLT LAZER REHBER YILDIZ / ESO', alpha);
      }

      // -----------------------------------------------------------------------
      // ACT 4 (12.5s - 16.5s): OBSERVATORY SPECTRUM WIPE (Crab Nebula)
      // Instrumental Crescendo & Laser Reveal
      // -----------------------------------------------------------------------
      else if (t < 16.5) {
        const p = (t - 12.5) / 4.0;
        const fadeIn = Math.min(1.0, (t - 12.5) / 0.5);
        const fadeOut = t > 16.0 ? (16.5 - t) / 0.5 : 1.0;
        const alpha = fadeIn * fadeOut;

        ctx.save();
        ctx.globalAlpha = alpha;
        drawSpectrumWipe(p, isVertical);
        ctx.restore();

        drawLowerThird(isVertical, 'BÖLÜM 05', 'GÖZLEMEVİ', 'GÖRÜNMEYENİ', 'gör.', 'NASA / ESA / CHANDRA / ALMA', alpha);
      }

      // -----------------------------------------------------------------------
      // ACT 5 (16.5s - 20.5s): WEBB PILLARS OF CREATION & DEEP TIME
      // Voice: "Şimdi hepsi tek bir yerde."
      // -----------------------------------------------------------------------
      else if (t < 20.5) {
        const p = (t - 16.5) / 4.0;
        const fadeIn = Math.min(1.0, (t - 16.5) / 0.5);
        const fadeOut = t > 20.0 ? (20.5 - t) / 0.5 : 1.0;
        const alpha = fadeIn * fadeOut;

        drawKenBurns(IMAGES.pillars, p, 0.5, 0.2, 0.5, 0.8, 1.05, 1.2, alpha * 0.95);

        drawLowerThird(isVertical, 'BÖLÜM 03', 'ANSİKLOPEDİ', 'ZAMANI', 'bük.', 'JAMES WEBB UZAY TELESKOBU / NASA / ESA', alpha);
      }

      // -----------------------------------------------------------------------
      // ACT 6 (20.5s - 24.5s): URANIA'S MIRROR ENGRAVINGS -> ISS LIVE ORBIT
      // Match cut from 1824 hand-drawn star chart to live space station!
      // -----------------------------------------------------------------------
      else if (t < 24.5) {
        const p = (t - 20.5) / 4.0;
        const fadeIn = Math.min(1.0, (t - 20.5) / 0.5);
        const fadeOut = t > 24.0 ? (24.5 - t) / 0.5 : 1.0;
        const alpha = fadeIn * fadeOut;

        // Cut between 1824 engraving (first 2 seconds) and ISS night lights (next 2 seconds)
        if (t < 22.5) {
          const subP = (t - 20.5) / 2.0;
          drawKenBurns(IMAGES.zodiac, subP, 0.45, 0.4, 0.55, 0.6, 1.05, 1.18, alpha * 0.9);
          drawLowerThird(isVertical, 'BÖLÜM 04', 'ASTROLOJİ', 'YILDIZLARINI', 'keşfet.', 'SIDNEY HALL, URANIA\'S MIRROR (1824)', alpha);
        } else {
          const subP = (t - 22.5) / 2.0;
          drawKenBurns(IMAGES.iss, subP, 0.4, 0.4, 0.6, 0.6, 1.0, 1.15, alpha * 0.95);
          drawLowerThird(isVertical, 'BÖLÜM 06', 'CANLI GÖKYÜZÜ', 'ŞU AN,', 'gökyüzünde.', 'NASA ISS EXPEDITION 62', alpha);
        }
      }

      // -----------------------------------------------------------------------
      // ACT 7 (24.5s - 30.0s): FINALE & OFFICIAL BRAND SEAL
      // Voice: "Spacetour. Evren hiç durmaz."
      // -----------------------------------------------------------------------
      else {
        const p = (t - 24.5) / 5.5;
        const fadeIn = Math.min(1.0, (t - 24.5) / 0.6);
        const alpha = fadeIn;

        ctx.save();
        ctx.globalAlpha = alpha;

        // Subtle glowing nebula in background
        const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.6);
        bgGrad.addColorStop(0, 'rgba(245, 197, 66, 0.08)');
        bgGrad.addColorStop(0.4, 'rgba(56, 189, 248, 0.04)');
        bgGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Logo SVG Recreation with glow
        const logoSize = isVertical ? 96 : 88;
        const logoX = W / 2 - logoSize / 2;
        const logoY = H / 2 - (isVertical ? 120 : 100);

        ctx.save();
        ctx.shadowColor = 'rgba(245, 197, 66, 0.4)';
        ctx.shadowBlur = 35;
        // Rounded card
        ctx.fillStyle = '#0B0B10';
        ctx.strokeStyle = 'rgba(244, 243, 238, 0.2)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(logoX, logoY, logoSize, logoSize, 20);
        ctx.fill();
        ctx.stroke();

        // Orbit ring
        ctx.strokeStyle = 'rgba(244, 243, 238, 0.6)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(W / 2, logoY + logoSize / 2, logoSize * 0.33, 0, Math.PI * 2);
        ctx.stroke();

        // Sun
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(W / 2, logoY + logoSize / 2, logoSize * 0.15, 0, Math.PI * 2);
        ctx.fill();

        // Planet
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(W / 2 + logoSize * 0.33, logoY + logoSize / 2, logoSize * 0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Brand Name
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        const brandY = logoY + logoSize + (isVertical ? 54 : 48);

        ctx.font = '900 ' + (isVertical ? '64px' : '68px') + ' "Archivo", sans-serif';
        ctx.fillStyle = '#F4F3EE';
        ctx.fillText('Spacetour', W / 2 - 28, brandY);

        ctx.fillStyle = '#F5C542';
        ctx.fillText('.tr', W / 2 + ctx.measureText('Spacetour').width / 2 - 14, brandY);

        // Slogan
        ctx.font = 'italic 400 ' + (isVertical ? '44px' : '46px') + ' "Instrument Serif", Georgia, serif';
        ctx.fillStyle = '#F5C542';
        ctx.fillText('Evren hiç durmaz.', W / 2, brandY + (isVertical ? 48 : 42));

        // Rule
        const ruleW = isVertical ? 260 : 300;
        const ruleGrad = ctx.createLinearGradient(W / 2 - ruleW / 2, 0, W / 2 + ruleW / 2, 0);
        ruleGrad.addColorStop(0, 'transparent');
        ruleGrad.addColorStop(0.5, 'rgba(245, 197, 66, 0.85)');
        ruleGrad.addColorStop(1, 'transparent');
        ctx.strokeStyle = ruleGrad;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(W / 2 - ruleW / 2, brandY + (isVertical ? 80 : 70));
        ctx.lineTo(W / 2 + ruleW / 2, brandY + (isVertical ? 80 : 70));
        ctx.stroke();

        // Domain
        ctx.font = '700 ' + (isVertical ? '22px' : '20px') + ' "Geist Mono", monospace';
        ctx.fillStyle = '#F4F3EE';
        ctx.fillText('spacetour.com.tr', W / 2, brandY + (isVertical ? 116 : 104));

        // License
        ctx.font = '400 ' + (isVertical ? '11px' : '10px') + ' "Geist Mono", monospace';
        ctx.fillStyle = 'rgba(244, 243, 238, 0.45)';
        ctx.fillText('Görseller: NASA, ESA, CSA, STScI, ESO, Wikimedia Commons ve ilgili sahipleri.', W / 2, brandY + (isVertical ? 150 : 136));
        ctx.fillText('Bölüm 00–07 Atlası Şimdi Yayında.', W / 2, brandY + (isVertical ? 168 : 152));

        ctx.restore();
      }

      // Draw Atmospheric Dust Particles
      drawParticles(t);

      // Draw Anamorphic Bars & Metadata Frame
      drawLetterboxing(isVertical);
    };
  </script>
</body>
</html>
